<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Game Site</title>
</head>
<body>

  <!-- 1. Load Firebase Modules -->
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, doc, setDoc, getDoc } from "https://gstatic.com";

    // Your exact configuration block
    const firebaseConfig = {
      apiKey: "AIzaSyBHpzd6hKcz-CRne_y2ITuYa5q6c47EyN8",
      authDomain: "penlauncher-54f16.firebaseapp.com",
      projectId: "penlauncher-54f16",
      storageBucket: "penlauncher-54f16.firebasestorage.app",
      messagingSenderId: "165881830205",
      appId: "1:165881830205:web:43a8b1a71621bc6c6c4354"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 2. Automatically load saved text from the database for everyone
    async function loadGameData() {
      try {
        const docSnap = await getDoc(doc(db, "game", "settings"));
        if (docSnap.exists()) {
          const data = docSnap.data();
          if(data.customMessage) {
            document.getElementById("game-announcement").innerText = data.customMessage;
          }
        } else {
          document.getElementById("game-announcement").innerText = "No announcements yet.";
        }
      } catch (error) {
        console.error("Error loading data:", error);
      }
    }
    window.addEventListener('DOMContentLoaded', loadGameData);

    // 3. Ask user for email cleanly without buttons to verify admin status
    async function checkOwnerIdentity() {
      const userEmail = prompt("Please enter your email to verify owner access (Players can click cancel):");
      
      if (userEmail === "thefallenshadow48@gmail.com") {
        alert("Access Granted. Welcome Owner!");
        document.getElementById("admin-controls").style.display = "block";
      } else if (userEmail) {
        alert("Access Denied. Standard player mode activated.");
      }
    }
    window.addEventListener('load', checkOwnerIdentity);

    // 4. Save your changes permanently to the cloud when you click Save
    window.saveAdminChanges = async function() {
      const newText = document.getElementById("admin-input").value;
      
      try {
        await setDoc(doc(db, "game", "settings"), {
          customMessage: newText
        });
        alert("Saved successfully! Refresh the page to see it updated.");
      } catch (e) {
        console.error("Error saving data: ", e);
        alert("Failed to save changes.");
      }
    }
  </script>

  <!-- Hidden Admin Panel Layout (Only pops up if you pass the email prompt) -->
  <div id="admin-controls" style="display: none; background: #1a1a1a; padding: 20px; border: 2px solid #ff4444; color: white; margin: 15px 0; font-family: sans-serif;">
    <h3>👑 Owner Panel (thefallenshadow48@gmail.com)</h3>
    <label>Update Website Text Globally:</label><br><br>
    <input type="text" id="admin-input" placeholder="Type updated game messages here..." style="padding: 8px; width: 300px;"><br><br>
    <button onclick="saveAdminChanges()" style="background: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px;">Save Globally</button>
  </div>

  <!-- Main Website Interface for regular players -->
  <div style="padding: 20px; font-family: sans-serif;">
    <h2>Welcome to the Game Website</h2>
    <hr>
    <h3>Latest Live Update:</h3>
    <p id="game-announcement" style="font-size: 1.2em; color: #333; font-style: italic;">Loading data from cloud database...</p>
  </div>

</body>
</html>
